<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON ASTEROIDS</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05010f;
    overflow: hidden;
    font-family: "Courier New", monospace;
    color: #0ff;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #14032b 0%, #05010f 70%);
  }
  #wrap {
    position: relative;
    box-shadow: 0 0 30px #f0f8, 0 0 60px #0ff4;
    border: 2px solid #f0f;
  }
  canvas {
    display: block;
    background: #07021a;
    max-width: 100vw;
    max-height: 100vh;
  }
  #scanlines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,0.18) 3px);
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="900" height="600"></canvas>
  <div id="scanlines"></div>
</div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  const CYAN = "#0ff", PINK = "#f0f", YELLOW = "#ff0", GREEN = "#0f8";

  const keys = {};
  let state = "start"; // start, play, over
  let ship, bullets, rocks, particles, stars;
  let score, lives, level, best = 0, shootCd, invuln, respawnTimer;

  // Stjärnbakgrund
  stars = Array.from({ length: 90 }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    s: Math.random() * 1.5 + 0.3,
    v: Math.random() * 0.4 + 0.1
  }));

  function resetGame() {
    score = 0;
    lives = 3;
    level = 1;
    bullets = [];
    particles = [];
    rocks = [];
    shootCd = 0;
    spawnShip();
    spawnWave();
  }

  function spawnShip() {
    ship = { x: W / 2, y: H / 2, vx: 0, vy: 0, a: -Math.PI / 2, r: 14 };
    invuln = 150;
  }

  function spawnWave() {
    const n = 3 + level;
    for (let i = 0; i < n; i++) {
      let x, y;
      do {
        x = Math.random() * W;
        y = Math.random() * H;
      } while (Math.hypot(x - ship.x, y - ship.y) < 180);
      rocks.push(makeRock(x, y, 3));
    }
  }

  function makeRock(x, y, size) {
    const r = size * 14 + 6;
    const pts = [];
    const n = 9 + Math.floor(Math.random() * 4);
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2;
      const d = r * (0.75 + Math.random() * 0.35);
      pts.push([Math.cos(ang) * d, Math.sin(ang) * d]);
    }
    const sp = (Math.random() * 0.9 + 0.4) * (4 - size) * 0.6 + 0.3 + level * 0.05;
    const dir = Math.random() * Math.PI * 2;
    return {
      x, y, size, r, pts,
      vx: Math.cos(dir) * sp,
      vy: Math.sin(dir) * sp,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.04,
      color: size === 3 ? PINK : size === 2 ? "#a5f" : "#f5a"
    };
  }

  function burst(x, y, color, n = 16) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = Math.random() * 3 + 0.5;
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 30 + Math.random() * 30,
        color
      });
    }
  }

  function wrap(o, m = 0) {
    if (o.x < -m) o.x = W + m;
    if (o.x > W + m) o.x = -m;
    if (o.y < -m) o.y = H + m;
    if (o.y > H + m) o.y = -m;
  }

  function update() {
    // stjärnor
    for (const s of stars) {
      s.y += s.v;
      if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    }

    if (state !== "play") {
      for (const r of rocks || []) {
        r.x += r.vx; r.y += r.vy; r.rot += r.vr; wrap(r, r.r);
      }
      return;
    }

    // skepp
    if (ship) {
      if (keys.ArrowLeft) ship.a -= 0.075;
      if (keys.ArrowRight) ship.a += 0.075;
      if (keys.ArrowUp) {
        ship.vx += Math.cos(ship.a) * 0.13;
        ship.vy += Math.sin(ship.a) * 0.13;
        if (Math.random() < 0.7) {
          particles.push({
            x: ship.x - Math.cos(ship.a) * 12,
            y: ship.y - Math.sin(ship.a) * 12,
            vx: -Math.cos(ship.a) * 2 + (Math.random() - 0.5),
            vy: -Math.sin(ship.a) * 2 + (Math.random() - 0.5),
            life: 15, color: YELLOW
          });
        }
      }
      if (keys.ArrowDown) {
        ship.vx *= 0.94;
        ship.vy *= 0.94;
      }
      ship.vx *= 0.995;
      ship.vy *= 0.995;
      const sp = Math.hypot(ship.vx, ship.vy);
      if (sp > 6) { ship.vx *= 6 / sp; ship.vy *= 6 / sp; }
      ship.x += ship.vx;
      ship.y += ship.vy;
      wrap(ship, 10);

      if (shootCd > 0) shootCd--;
      if (keys.Space && shootCd <= 0) {
        bullets.push({
          x: ship.x + Math.cos(ship.a) * 16,
          y: ship.y + Math.sin(ship.a) * 16,
          vx: Math.cos(ship.a) * 8 + ship.vx * 0.5,
          vy: Math.sin(ship.a) * 8 + ship.vy * 0.5,
          life: 70
        });
        shootCd = 10;
      }
      if (invuln > 0) invuln--;
    } else {
      respawnTimer--;
      if (respawnTimer <= 0) {
        if (lives > 0) spawnShip();
        else { state = "over"; best = Math.max(best, score); }
      }
    }

    // skott
    for (const b of bullets) {
      b.x += b.vx; b.y += b.vy; b.life--;
      wrap(b);
    }
    bullets = bullets.filter(b => b.life > 0);

    // asteroider
    for (const r of rocks) {
      r.x += r.vx; r.y += r.vy; r.rot += r.vr;
      wrap(r, r.r);
    }

    // skott mot asteroider
    for (const b of bullets) {
      for (const r of rocks) {
        if (!r.dead && Math.hypot(b.x - r.x, b.y - r.y) < r.r) {
          r.dead = true;
          b.life = 0;
          score += (4 - r.size) * 20;
          burst(r.x, r.y, r.color, 14 + r.size * 4);
          if (r.size > 1) {
            for (let i = 0; i < 2; i++) rocks.push(makeRock(r.x, r.y, r.size - 1));
          }
          break;
        }
      }
    }
    rocks = rocks.filter(r => !r.dead);

    // skepp mot asteroider
    if (ship && invuln <= 0) {
      for (const r of rocks) {
        if (Math.hypot(ship.x - r.x, ship.y - r.y) < r.r * 0.85 + ship.r * 0.6) {
          burst(ship.x, ship.y, CYAN, 40);
          burst(ship.x, ship.y, YELLOW, 20);
          ship = null;
          lives--;
          respawnTimer = 90;
          break;
        }
      }
    }

    // partiklar
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.life--;
      p.vx *= 0.98; p.vy *= 0.98;
    }
    particles = particles.filter(p => p.life > 0);

    // ny våg
    if (rocks.length === 0) {
      level++;
      spawnWave();
      if (ship) invuln = Math.max(invuln, 90);
    }
  }

  function glow(color, blur = 12) {
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = blur;
  }

  function drawGrid() {
    ctx.save();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(255,0,255,0.08)";
    ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 45) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y <= H; y += 45) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.restore();
  }

  function drawShip() {
    if (!ship) return;
    if (invuln > 0 && Math.floor(invuln / 5) % 2 === 0) return;
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.a);
    glow(CYAN, 16);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(18, 0);
    ctx.lineTo(-12, 11);
    ctx.lineTo(-6, 0);
    ctx.lineTo(-12, -11);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  function drawRocks() {
    ctx.lineWidth = 2;
    for (const r of rocks) {
      ctx.save();
      ctx.translate(r.x, r.y);
      ctx.rotate(r.rot);
      glow(r.color, 14);
      ctx.beginPath();
      r.pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawBullets() {
    glow(YELLOW, 14);
    for (const b of bullets) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 45);
      glow(p.color, 8);
      ctx.fillRect(p.x, p.y, 2.5, 2.5);
    }
    ctx.globalAlpha = 1;
  }

  function text(str, x, y, size, color, align = "center") {
    ctx.font = `bold ${size}px "Courier New", monospace`;
    ctx.textAlign = align;
    glow(color, 14);
    ctx.fillText(str, x, y);
  }

  function drawHUD() {
    text("POÄNG " + String(score).padStart(6, "0"), 20, 32, 22, CYAN, "left");
    text("NIVÅ " + level, W / 2, 32, 22, YELLOW);
    // liv som små skepp
    text("LIV", W - 150, 32, 22, PINK, "right");
    for (let i = 0; i < lives; i++) {
      ctx.save();
      ctx.translate(W - 125 + i * 32, 25);
      ctx.rotate(-Math.PI / 2);
      glow(PINK, 10);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(11, 0); ctx.lineTo(-8, 7); ctx.lineTo(-4, 0); ctx.lineTo(-8, -7);
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }
  }

  function draw() {
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#07021a";
    ctx.fillRect(0, 0, W, H);
    drawGrid();

    ctx.shadowBlur = 0;
    for (const s of stars) {
      ctx.fillStyle = "rgba(180,255,255," + (0.3 + s.s / 3) + ")";
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }

    drawRocks();
    drawBullets();
    drawShip();
    drawParticles();

    if (state === "play") {
      drawHUD();
    } else if (state === "start") {
      text("NEON ASTEROIDS", W / 2, H / 2 - 50, 56, CYAN);
      text("← → rotera   ↑ thrust   ↓ broms   MELLANSLAG skjut", W / 2, H / 2 + 5, 18, PINK);
      if (Math.floor(Date.now() / 500) % 2) text("TRYCK MELLANSLAG FÖR ATT STARTA", W / 2, H / 2 + 60, 22, YELLOW);
    } else if (state === "over") {
      text("GAME OVER", W / 2, H / 2 - 40, 60, PINK);
      text("POÄNG: " + score + "   REKORD: " + best, W / 2, H / 2 + 10, 24, CYAN);
      if (Math.floor(Date.now() / 500) % 2) text("TRYCK MELLANSLAG FÖR ATT SPELA IGEN", W / 2, H / 2 + 60, 22, YELLOW);
    }
    ctx.shadowBlur = 0;
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener("keydown", e => {
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(e.code)) {
      e.preventDefault();
    }
    keys[e.code] = true;
    if (e.code === "Space" && !e.repeat && state !== "play") {
      resetGame();
      state = "play";
    }
  });
  window.addEventListener("keyup", e => { keys[e.code] = false; });

  // Bakgrundsasteroider på startskärmen
  score = 0; lives = 3; level = 1; bullets = []; particles = []; rocks = [];
  ship = { x: -100, y: -100 };
  for (let i = 0; i < 6; i++) rocks.push(makeRock(Math.random() * W, Math.random() * H, 3));
  ship = null;

  loop();
})();
</script>
</body>
</html>
