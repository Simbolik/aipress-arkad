<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>NEON STRIKE</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05060a;
    color: #e8f7ff;
    font-family: "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  #wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    margin: 0;
    letter-spacing: 0.45em;
    font-weight: 700;
    font-size: 22px;
    color: #7df9ff;
    text-shadow: 0 0 8px #00f0ff, 0 0 22px #ff2bd6;
  }
  #hud {
    width: 900px;
    max-width: 96vw;
    display: flex;
    justify-content: space-between;
    font-size: 16px;
    letter-spacing: 0.12em;
  }
  #hud span { text-shadow: 0 0 8px currentColor; }
  #score { color: #7df9ff; }
  #lives { color: #ff4fd8; }
  canvas {
    width: 900px;
    max-width: 96vw;
    height: auto;
    background: #070814;
    border: 1px solid #1b2a44;
    box-shadow: 0 0 24px rgba(0, 240, 255, 0.25), inset 0 0 40px rgba(255, 43, 214, 0.08);
    display: block;
  }
  #hint {
    opacity: 0.7;
    font-size: 13px;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>NEON STRIKE</h1>
  <div id="hud">
    <span id="score">POÄNG 0</span>
    <span id="lives">LIV 3</span>
  </div>
  <canvas id="c" width="900" height="560"></canvas>
  <div id="hint">PILAR = STYR &nbsp;·&nbsp; MELLANSLAG = SKJUT &nbsp;·&nbsp; R = STARTA OM</div>
</div>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

const keys = {};
let score = 0, lives = 3, over = false, spawnT = 0, shotCd = 0;
let stars = [], asteroids = [], bullets = [], particles = [];

const ship = { x: W / 2, y: H - 70, w: 36, h: 28, speed: 6.2 };

function rand(a, b) { return a + Math.random() * (b - a); }

function reset() {
  score = 0; lives = 3; over = false; spawnT = 0; shotCd = 0;
  asteroids = []; bullets = []; particles = [];
  ship.x = W / 2; ship.y = H - 70;
  stars = Array.from({ length: 90 }, () => ({
    x: rand(0, W), y: rand(0, H), s: rand(0.4, 1.8), v: rand(0.3, 1.6),
    c: Math.random() < 0.15 ? "#ff4fd8" : "#7df9ff"
  }));
  updateHud();
}
reset();

function updateHud() {
  document.getElementById("score").textContent = "POÄNG " + score;
  document.getElementById("lives").textContent = "LIV " + lives;
}

addEventListener("keydown", e => {
  keys[e.code] = true;
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  if (e.code === "KeyR") reset();
});
addEventListener("keyup", e => { keys[e.code] = false; });

function shoot() {
  if (shotCd > 0 || over) return;
  shotCd = 12;
  bullets.push({ x: ship.x, y: ship.y - ship.h / 2, vy: -11, r: 3 });
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(1, 5);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(18, 36), color });
  }
}

function spawnAsteroid() {
  const r = rand(14, 32);
  asteroids.push({
    x: rand(r, W - r), y: -r, r,
    vy: rand(1.4, 3.2) + score * 0.01,
    vx: rand(-1.1, 1.1),
    rot: rand(0, Math.PI * 2),
    vr: rand(-0.04, 0.04),
    sides: 6 + (Math.random() * 4 | 0)
  });
}

function hit(ax, ay, ar, bx, by, br) {
  const dx = ax - bx, dy = ay - by;
  return dx * dx + dy * dy < (ar + br) * (ar + br);
}

function update() {
  if (!over) {
    if (keys.ArrowLeft) ship.x -= ship.speed;
    if (keys.ArrowRight) ship.x += ship.speed;
    if (keys.ArrowUp) ship.y -= ship.speed;
    if (keys.ArrowDown) ship.y += ship.speed;
    ship.x = Math.max(24, Math.min(W - 24, ship.x));
    ship.y = Math.max(40, Math.min(H - 28, ship.y));
    if (keys.Space) shoot();
    if (shotCd > 0) shotCd--;

    spawnT--;
    if (spawnT <= 0) {
      spawnAsteroid();
      spawnT = Math.max(18, 55 - score * 0.15);
    }
  }

  stars.forEach(s => {
    s.y += s.v;
    if (s.y > H) { s.y = 0; s.x = rand(0, W); }
  });

  bullets.forEach(b => b.y += b.vy);
  bullets = bullets.filter(b => b.y > -10);

  asteroids.forEach(a => {
    a.x += a.vx; a.y += a.vy; a.rot += a.vr;
    if (a.x < a.r || a.x > W - a.r) a.vx *= -1;
  });

  for (let i = asteroids.length - 1; i >= 0; i--) {
    const a = asteroids[i];
    let destroyed = false;
    for (let j = bullets.length - 1; j >= 0; j--) {
      if (hit(a.x, a.y, a.r, bullets[j].x, bullets[j].y, bullets[j].r)) {
        bullets.splice(j, 1);
        score += 10;
        burst(a.x, a.y, "#b8ff3c", 16);
        destroyed = true;
        break;
      }
    }
    if (!destroyed && !over && hit(a.x, a.y, a.r * 0.85, ship.x, ship.y, 14)) {
      burst(ship.x, ship.y, "#ff4fd8", 22);
      lives--;
      destroyed = true;
      if (lives <= 0) over = true;
    }
    if (a.y - a.r > H) {
      if (!over) { lives--; if (lives <= 0) over = true; }
      destroyed = true;
    }
    if (destroyed) asteroids.splice(i, 1);
  }
  updateHud();

  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
  particles = particles.filter(p => p.life > 0);
}

function drawShip() {
  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.shadowColor = "#00f0ff";
  ctx.shadowBlur = 16;
  ctx.fillStyle = "#071018";
  ctx.strokeStyle = "#7df9ff";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, -18);
  ctx.lineTo(16, 14);
  ctx.lineTo(6, 8);
  ctx.lineTo(0, 16);
  ctx.lineTo(-6, 8);
  ctx.lineTo(-16, 14);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.shadowColor = "#ff2bd6";
  ctx.fillStyle = "#ff4fd8";
  ctx.fillRect(-3, 6, 6, 6);
  ctx.restore();
}

function drawAsteroid(a) {
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.rot);
  ctx.shadowColor = "#ff2bd6";
  ctx.shadowBlur = 12;
  ctx.strokeStyle = "#ff7ae0";
  ctx.fillStyle = "rgba(40, 8, 32, 0.85)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < a.sides; i++) {
    const ang = (i / a.sides) * Math.PI * 2;
    const rr = a.r * (0.78 + (i % 2) * 0.22);
    const x = Math.cos(ang) * rr, y = Math.sin(ang) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function draw() {
  ctx.fillStyle = "#070814";
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = "rgba(0, 240, 255, 0.07)";
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  stars.forEach(s => {
    ctx.fillStyle = s.c;
    ctx.globalAlpha = 0.55 + s.s * 0.2;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  });
  ctx.globalAlpha = 1;

  asteroids.forEach(drawAsteroid);

  bullets.forEach(b => {
    ctx.shadowColor = "#b8ff3c";
    ctx.shadowBlur = 12;
    ctx.fillStyle = "#d6ff6a";
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / 36);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 2.5, 2.5);
  });
  ctx.globalAlpha = 1;

  if (!over) drawShip();

  if (over) {
    ctx.fillStyle = "rgba(5, 6, 12, 0.55)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff4fd8";
    ctx.shadowColor = "#ff2bd6";
    ctx.shadowBlur = 18;
    ctx.font = "700 42px Segoe UI, sans-serif";
    ctx.fillText("SYSTEM FAILURE", W / 2, H / 2 - 10);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#7df9ff";
    ctx.font = "18px Segoe UI, sans-serif";
    ctx.fillText("POÄNG " + score + "   ·   TRYCK R", W / 2, H / 2 + 28);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
