<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>NEON VOID</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05060a;
    color: #e8f7ff;
    font-family: "Courier New", Courier, monospace;
    overflow: hidden;
  }
  canvas { display: block; margin: 0 auto; background: #05060a; }
  #hud {
    position: fixed;
    top: 12px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 28px;
    pointer-events: none;
    text-shadow: 0 0 8px #0ff, 0 0 18px #f0f;
    letter-spacing: 2px;
    font-size: 18px;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(5, 6, 10, 0.72);
    text-align: center;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 64px;
    letter-spacing: 10px;
    color: #ff2bd6;
    text-shadow: 0 0 12px #ff2bd6, 0 0 28px #22e7ff;
  }
  p { margin: 6px 0; color: #9af7ff; }
  .hint { color: #ffe14a; margin-top: 18px; }
</style>
</head>
<body>
<div id="hud">
  <div>POÄNG <span id="score">0</span></div>
  <div>NEON VOID</div>
  <div>LIV <span id="lives">3</span></div>
</div>
<div id="overlay">
  <h1>NEON VOID</h1>
  <p>PILAR = styra &nbsp;&nbsp; MELLANSLAG = skjut</p>
  <p class="hint">TRYCK MELLANSLAG FÖR ATT STARTA</p>
</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const overlay = document.getElementById("overlay");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const keys = {};
window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  if (e.code === "Space") {
    if (state === "menu" || state === "dead") start();
    else if (state === "play") shoot();
  }
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

let state = "menu";
let score = 0, lives = 3, shake = 0, spawnT = 0, fireCd = 0;
let ship, bullets, rocks, particles, stars;

function rand(a, b) { return a + Math.random() * (b - a); }

function makeStars() {
  stars = [];
  for (let i = 0; i < 120; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      z: rand(0.3, 1.4),
      c: Math.random() < 0.15 ? "#ff2bd6" : Math.random() < 0.3 ? "#ffe14a" : "#7af6ff"
    });
  }
}

function start() {
  score = 0; lives = 3; shake = 0; spawnT = 0; fireCd = 0;
  ship = { x: canvas.width / 2, y: canvas.height * 0.78, a: -Math.PI / 2, vx: 0, vy: 0, inv: 90 };
  bullets = [];
  rocks = [];
  particles = [];
  makeStars();
  scoreEl.textContent = "0";
  livesEl.textContent = "3";
  overlay.style.display = "none";
  state = "play";
  for (let i = 0; i < 5; i++) spawnRock(true);
}

function spawnRock(edge) {
  const r = rand(18, 42);
  let x, y;
  if (edge) {
    const side = Math.floor(Math.random() * 4);
    if (side === 0) { x = rand(0, canvas.width); y = -r; }
    else if (side === 1) { x = canvas.width + r; y = rand(0, canvas.height); }
    else if (side === 2) { x = rand(0, canvas.width); y = canvas.height + r; }
    else { x = -r; y = rand(0, canvas.height); }
  } else {
    x = rand(40, canvas.width - 40);
    y = rand(40, canvas.height * 0.4);
  }
  const sp = rand(0.6, 1.8) + Math.min(score / 400, 2.2);
  const ang = rand(0, Math.PI * 2);
  const verts = [];
  const n = 7 + Math.floor(Math.random() * 4);
  for (let i = 0; i < n; i++) verts.push(rand(0.7, 1.15));
  rocks.push({
    x, y, r,
    vx: Math.cos(ang) * sp,
    vy: Math.sin(ang) * sp,
    rot: rand(0, 6),
    spin: rand(-0.03, 0.03),
    verts,
    hue: Math.random() < 0.5 ? "#22e7ff" : "#ff2bd6"
  });
}

function shoot() {
  if (fireCd > 0 || state !== "play") return;
  fireCd = 12;
  const nose = 18;
  bullets.push({
    x: ship.x + Math.cos(ship.a) * nose,
    y: ship.y + Math.sin(ship.a) * nose,
    vx: Math.cos(ship.a) * 11 + ship.vx * 0.2,
    vy: Math.sin(ship.a) * 11 + ship.vy * 0.2,
    life: 70
  });
}

function boom(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2);
    const s = rand(0.6, 4.2);
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: rand(18, 40),
      max: 40,
      c: color,
      w: rand(1.5, 3.5)
    });
  }
}

function hitShip() {
  if (ship.inv > 0) return;
  lives--;
  livesEl.textContent = lives;
  shake = 14;
  ship.inv = 110;
  boom(ship.x, ship.y, "#ffe14a", 28);
  if (lives <= 0) {
    state = "dead";
    overlay.style.display = "flex";
    overlay.innerHTML =
      "<h1>GAME OVER</h1><p>POÄNG " + score +
      "</p><p class='hint'>TRYCK MELLANSLAG FÖR ATT SPELA IGEN</p>";
  }
}

function wrap(o) {
  if (o.x < -60) o.x = canvas.width + 60;
  if (o.x > canvas.width + 60) o.x = -60;
  if (o.y < -60) o.y = canvas.height + 60;
  if (o.y > canvas.height + 60) o.y = -60;
}

function update() {
  if (state !== "play") return;
  const accel = 0.28;
  if (keys.ArrowLeft) ship.a -= 0.07;
  if (keys.ArrowRight) ship.a += 0.07;
  if (keys.ArrowUp) {
    ship.vx += Math.cos(ship.a) * accel;
    ship.vy += Math.sin(ship.a) * accel;
    boom(ship.x - Math.cos(ship.a) * 14, ship.y - Math.sin(ship.a) * 14, "#ff2bd6", 1);
  }
  if (keys.ArrowDown) {
    ship.vx *= 0.96;
    ship.vy *= 0.96;
  }
  if (keys.Space) shoot();
  ship.vx *= 0.985;
  ship.vy *= 0.985;
  const sp = Math.hypot(ship.vx, ship.vy);
  if (sp > 7) { ship.vx *= 7 / sp; ship.vy *= 7 / sp; }
  ship.x += ship.vx;
  ship.y += ship.vy;
  wrap(ship);
  if (ship.inv > 0) ship.inv--;
  if (fireCd > 0) fireCd--;

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    if (b.life <= 0 || b.x < -20 || b.y < -20 || b.x > canvas.width + 20 || b.y > canvas.height + 20) {
      bullets.splice(i, 1);
    }
  }

  spawnT++;
  const interval = Math.max(28, 78 - score / 12);
  if (spawnT > interval) { spawnT = 0; spawnRock(true); }

  for (const r of rocks) {
    r.x += r.vx; r.y += r.vy; r.rot += r.spin;
    wrap(r);
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    for (let j = rocks.length - 1; j >= 0; j--) {
      const r = rocks[j];
      const dx = b.x - r.x, dy = b.y - r.y;
      if (dx * dx + dy * dy < (r.r + 3) * (r.r + 3)) {
        bullets.splice(i, 1);
        rocks.splice(j, 1);
        const pts = Math.max(10, 50 - Math.floor(r.r));
        score += pts;
        scoreEl.textContent = score;
        boom(r.x, r.y, r.hue, 16);
        if (r.r > 24) {
          for (let k = 0; k < 2; k++) {
            const ang = rand(0, Math.PI * 2);
            rocks.push({
              x: r.x, y: r.y, r: r.r * 0.55,
              vx: Math.cos(ang) * rand(1.2, 2.6),
              vy: Math.sin(ang) * rand(1.2, 2.6),
              rot: r.rot, spin: rand(-0.05, 0.05),
              verts: r.verts.map(v => v * rand(0.85, 1.1)),
              hue: r.hue
            });
          }
        }
        break;
      }
    }
  }

  for (const r of rocks) {
    const dx = ship.x - r.x, dy = ship.y - r.y;
    if (dx * dx + dy * dy < (r.r + 10) * (r.r + 10)) hitShip();
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life--;
    p.vx *= 0.98; p.vy *= 0.98;
    if (p.life <= 0) particles.splice(i, 1);
  }
  if (shake > 0) shake *= 0.86;
}

function drawShip() {
  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.a);
  if (ship.inv > 0 && Math.floor(ship.inv / 4) % 2 === 0) ctx.globalAlpha = 0.35;
  ctx.shadowColor = "#22e7ff";
  ctx.shadowBlur = 16;
  ctx.strokeStyle = "#e8ffff";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(18, 0);
  ctx.lineTo(-14, 10);
  ctx.lineTo(-8, 0);
  ctx.lineTo(-14, -10);
  ctx.closePath();
  ctx.stroke();
  ctx.strokeStyle = "#ff2bd6";
  ctx.beginPath();
  ctx.moveTo(-8, 0);
  ctx.lineTo(-16, 5);
  ctx.moveTo(-8, 0);
  ctx.lineTo(-16, -5);
  ctx.stroke();
  ctx.restore();
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#05060a";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (shake > 0.4) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  // grid
  ctx.strokeStyle = "rgba(34,231,255,0.08)";
  ctx.lineWidth = 1;
  const gy = ((performance.now() / 18) % 48);
  for (let x = 0; x < canvas.width; x += 48) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = -48 + gy; y < canvas.height; y += 48) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  for (const s of stars) {
    s.y += s.z * 0.45;
    if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
    ctx.fillStyle = s.c;
    ctx.globalAlpha = 0.45 + s.z * 0.35;
    ctx.fillRect(s.x, s.y, s.z * 2, s.z * 2);
  }
  ctx.globalAlpha = 1;

  for (const r of rocks) {
    ctx.save();
    ctx.translate(r.x, r.y);
    ctx.rotate(r.rot);
    ctx.shadowColor = r.hue;
    ctx.shadowBlur = 14;
    ctx.strokeStyle = r.hue;
    ctx.lineWidth = 2;
    ctx.beginPath();
    const n = r.verts.length;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const rr = r.r * r.verts[i];
      const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  for (const b of bullets) {
    ctx.shadowColor = "#ffe14a";
    ctx.shadowBlur = 12;
    ctx.strokeStyle = "#fff6b0";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 0.7, b.y - b.vy * 0.7);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.strokeStyle = p.c;
    ctx.lineWidth = p.w;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx * 2, p.y - p.vy * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  if (state === "play" || (state === "dead" && lives === 0)) drawShip();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
makeStars();
loop();
</script>
</body>
</html>
