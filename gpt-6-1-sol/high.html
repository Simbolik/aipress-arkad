<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Asteroids</title>
<style>
  :root {
    color-scheme: dark;
    --cyan: #00f5ff;
    --pink: #ff2bd6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background:
      radial-gradient(ellipse at 20% 20%, #211039 0, transparent 55%),
      radial-gradient(ellipse at 85% 85%, #032632 0, transparent 50%),
      #070910;
    color: #e4faff;
    font-family: "Courier New", monospace;
  }
  main { width: min(960px, 96vw); padding: 22px 0; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
  }
  h1 {
    margin: 0;
    font-size: clamp(20px, 4vw, 34px);
    letter-spacing: 3px;
    color: var(--cyan);
    text-shadow: 0 0 18px #00f5ff88;
  }
  .subtitle { margin-top: 6px; color: #9ba9c6; font-size: 12px; }
  #status {
    color: var(--pink);
    font-size: 12px;
    text-align: right;
    letter-spacing: 2px;
  }
  .hud {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    border: 1px solid #00f5ff55;
    border-bottom: 0;
    background: #091320;
    font-size: clamp(12px, 2.3vw, 16px);
  }
  .hud span { color: #92a7bd; }
  .hud strong { color: var(--cyan); }
  #lives { color: var(--pink); letter-spacing: 3px; }
  .screen {
    position: relative;
    overflow: hidden;
    border: 1px solid #00f5ff88;
    box-shadow: 0 0 28px #00f5ff18, 0 0 70px #ff2bd610;
  }
  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      transparent 0 3px, #00000022 3px 4px
    );
  }
  canvas {
    display: block;
    width: 100%;
    aspect-ratio: 900 / 560;
    background: #070a16;
  }
  footer {
    margin-top: 15px;
    text-align: center;
    color: #a9b6ce;
    font-size: 12px;
    line-height: 2;
  }
  kbd {
    padding: 3px 6px;
    border: 1px solid #35425d;
    border-radius: 3px;
    background: #11182b;
    color: #e4faff;
    font: inherit;
  }
  @media (max-width: 520px) {
    #status { display: none; }
    .hud { padding: 10px 8px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>NEON // ASTEROIDS</h1>
      <div class="subtitle">Överlev i neonstormen.</div>
    </div>
    <div id="status">SYSTEM ONLINE</div>
  </header>

  <div class="hud" aria-label="Spelstatus">
    <div><span>POÄNG </span><strong id="score">0</strong></div>
    <div><span>REKORD </span><strong id="best">0</strong></div>
    <div><span>LIV </span><strong id="lives">♥ ♥ ♥</strong></div>
  </div>

  <div class="screen">
    <canvas id="game" width="900" height="560"
      aria-label="Rymdspel. Flytta med piltangenterna och skjut med mellanslag.">
      Din webbläsare behöver stöd för Canvas för att spela.
    </canvas>
  </div>

  <footer>
    <kbd>↑ ↓ ← →</kbd> Flytta &nbsp;
    <kbd>MELLANSLAG</kbd> Skjut &nbsp;
    <kbd>P</kbd> Paus &nbsp;
    <kbd>R</kbd> Starta om
  </footer>
</main>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const livesEl = document.getElementById("lives");
  const statusEl = document.getElementById("status");

  const W = 900, H = 560;
  const CYAN = "#00f5ff", PINK = "#ff2bd6";
  const keys = new Set();
  const random = (min, max) => min + Math.random() * (max - min);
  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
  const overlaps = (a, b) =>
    (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < (a.r + b.r) ** 2;

  let best = 0;
  try {
    const saved = Number(localStorage.getItem("neon-asteroids-best"));
    if (Number.isFinite(saved) && saved > 0) best = saved;
  } catch (_) {}

  let ship, bullets, rocks, particles;
  let score, lives, elapsed, spawnTimer, state;
  let previousTime = performance.now();

  const stars = Array.from({ length: 95 }, () => ({
    x: random(0, W), y: random(0, H),
    speed: random(12, 65), size: random(0.7, 2),
    alpha: random(0.2, 0.8)
  }));

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  }

  function saveBest() {
    try {
      localStorage.setItem("neon-asteroids-best", String(best));
    } catch (_) {}
  }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    livesEl.textContent = "♥ ".repeat(lives).trim() || "—";
    statusEl.textContent =
      state === "playing" ? "SYSTEM ONLINE" :
      state === "paused" ? "SYSTEM PAUSAT" : "SIGNAL FÖRLORAD";
  }

  function restart() {
    if (score !== undefined) saveBest();
    ship = { x: W / 2, y: H - 75, r: 14, cooldown: 0, invincible: 1.5 };
    bullets = [];
    rocks = [];
    particles = [];
    score = 0;
    lives = 3;
    elapsed = 0;
    spawnTimer = 0.4;
    state = "playing";
    keys.clear();
    updateHud();
  }

  function makeRock(x, y, radius, vx, vy) {
    const count = 11;
    return {
      x, y, r: radius, vx, vy,
      angle: random(0, Math.PI * 2),
      spin: random(-1.6, 1.6),
      points: Array.from({ length: count }, () => random(0.72, 1.05)),
      color: Math.random() > 0.45 ? PINK : "#b584ff",
      dead: false
    };
  }

  function spawnRock() {
    const radius = random(20, 46);
    const difficulty = Math.min(elapsed / 24, 7);
    rocks.push(makeRock(
      random(radius, W - radius),
      -radius - 10,
      radius,
      random(-35, 35),
      random(65, 110) + difficulty * 15
    ));
  }

  function burst(x, y, color, count = 20) {
    for (let i = 0; i < count; i++) {
      const angle = random(0, Math.PI * 2);
      const speed = random(30, 190);
      const life = random(0.25, 0.75);
      particles.push({
        x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life, maxLife: life, color, size: random(1, 3)
      });
    }
    if (particles.length > 450) particles.splice(0, particles.length - 450);
  }

  function hitShip(rock) {
    rock.dead = true;
    burst(rock.x, rock.y, rock.color, 24);
    burst(ship.x, ship.y, CYAN, 35);
    lives--;
    ship.invincible = 2;
    if (lives <= 0) {
      state = "over";
      saveBest();
      keys.clear();
    }
    updateHud();
  }

  function update(dt) {
    elapsed += dt;
    ship.invincible = Math.max(0, ship.invincible - dt);
    ship.cooldown -= dt;

    let dx = Number(keys.has("ArrowRight")) - Number(keys.has("ArrowLeft"));
    let dy = Number(keys.has("ArrowDown")) - Number(keys.has("ArrowUp"));
    const length = Math.hypot(dx, dy) || 1;
    ship.x = clamp(ship.x + dx / length * 330 * dt, 22, W - 22);
    ship.y = clamp(ship.y + dy / length * 330 * dt, 30, H - 28);

    if (keys.has("Space") && ship.cooldown <= 0) {
      bullets.push({ x: ship.x, y: ship.y - 25, r: 4, dead: false });
      ship.cooldown = 0.14;
      burst(ship.x, ship.y - 25, CYAN, 3);
    }

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnRock();
      spawnTimer = Math.max(0.28, 0.95 - elapsed * 0.007);
    }

    for (const bullet of bullets) {
      bullet.y -= 620 * dt;
      if (bullet.y < -20) bullet.dead = true;
    }
    for (const rock of rocks) {
      rock.x += rock.vx * dt;
      rock.y += rock.vy * dt;
      rock.angle += rock.spin * dt;
      if (rock.x < rock.r && rock.vx < 0) rock.vx *= -1;
      if (rock.x > W - rock.r && rock.vx > 0) rock.vx *= -1;
      if (rock.y > H + rock.r) rock.dead = true;
    }

    const fragments = [];
    for (const bullet of bullets) {
      if (bullet.dead) continue;
      for (const rock of rocks) {
        if (rock.dead || !overlaps(bullet, rock)) continue;
        bullet.dead = true;
        rock.dead = true;
        score += rock.r > 29 ? 30 : rock.r > 18 ? 20 : 10;
        best = Math.max(best, score);
        burst(rock.x, rock.y, rock.color, 22);

        if (rock.r > 29) {
          for (const direction of [-1, 1]) {
            fragments.push(makeRock(
              rock.x + direction * 9, rock.y, rock.r * 0.55,
              rock.vx + direction * random(50, 90),
              rock.vy * 1.2
            ));
          }
        }
        updateHud();
        break;
      }
    }

    if (ship.invincible <= 0) {
      for (const rock of rocks) {
        if (!rock.dead && overlaps(ship, rock)) {
          hitShip(rock);
          break;
        }
      }
    }

    bullets = bullets.filter(b => !b.dead);
    rocks = rocks.filter(r => !r.dead).concat(fragments);
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
  }

  function drawBackground(dt) {
    const gradient = ctx.createLinearGradient(0, 0, 0, H);
    gradient.addColorStop(0, "#060a18");
    gradient.addColorStop(1, "#180b29");
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    for (const star of stars) {
      if (state === "playing") star.y += star.speed * dt;
      if (star.y > H) { star.y = 0; star.x = random(0, W); }
      ctx.globalAlpha = star.alpha;
      ctx.fillStyle = "#bbecff";
      ctx.fillRect(star.x, star.y, star.size, star.size * 1.8);
    }
    ctx.globalAlpha = 1;

    const horizon = H * 0.65;
    ctx.lineWidth = 1;
    ctx.strokeStyle = "#ff2bd61c";
    ctx.beginPath();
    for (let i = -8; i <= 8; i++) {
      ctx.moveTo(W / 2 + i * 18, horizon);
      ctx.lineTo(W / 2 + i * 130, H);
    }
    for (let i = 1; i <= 8; i++) {
      const y = horizon + (H - horizon) * (i / 8) ** 2;
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
    }
    ctx.stroke();
  }

  function drawShip(time) {
    if (state === "over") return;
    if (ship.invincible > 0 && Math.floor(time * 12) % 2 === 0) {
      ctx.globalAlpha = 0.35;
    }

    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.shadowBlur = 16;
    ctx.shadowColor = CYAN;

    const flame = 12 + Math.sin(time * 35) * 5;
    ctx.fillStyle = PINK;
    ctx.beginPath();
    ctx.moveTo(-7, 16);
    ctx.lineTo(0, 16 + flame);
    ctx.lineTo(7, 16);
    ctx.fill();

    ctx.fillStyle = "#0b2139";
    ctx.strokeStyle = CYAN;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -24);
    ctx.lineTo(19, 19);
    ctx.lineTo(0, 11);
    ctx.lineTo(-19, 19);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = PINK;
    ctx.beginPath();
    ctx.moveTo(0, -12);
    ctx.lineTo(5, 5);
    ctx.lineTo(-5, 5);
    ctx.closePath();
    ctx.fill();

    if (ship.invincible > 0) {
      ctx.strokeStyle = "#00f5ff66";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, 31, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawOverlay() {
    if (state === "playing") return;
    ctx.fillStyle = "#040713c9";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.shadowBlur = 20;
    ctx.shadowColor = state === "over" ? PINK : CYAN;
    ctx.fillStyle = state === "over" ? PINK : CYAN;
    ctx.font = "bold 42px 'Courier New', monospace";
    ctx.fillText(state === "over" ? "SIGNAL FÖRLORAD" : "PAUS", W / 2, H / 2 - 40);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#e4faff";
    ctx.font = "20px 'Courier New', monospace";
    ctx.fillText(
      state === "over" ? `POÄNG: ${score}  //  REKORD: ${best}` : "Ta ett andetag, pilot.",
      W / 2, H / 2 + 6
    );
    ctx.fillStyle = "#a9b6ce";
    ctx.font = "16px 'Courier New', monospace";
    ctx.fillText(
      state === "over" ? "MELLANSLAG eller R för att starta om" : "P eller MELLANSLAG för att fortsätta",
      W / 2, H / 2 + 52
    );
    ctx.textAlign = "left";
  }

  function draw(dt, time) {
    drawBackground(dt);

    ctx.save();
    ctx.shadowBlur = 14;
    ctx.shadowColor = CYAN;
    ctx.fillStyle = CYAN;
    for (const bullet of bullets) {
      ctx.fillRect(bullet.x - 2, bullet.y - 10, 4, 18);
    }
    ctx.restore();

    for (const rock of rocks) {
      ctx.save();
      ctx.translate(rock.x, rock.y);
      ctx.rotate(rock.angle);
      ctx.fillStyle = "#190e2b";
      ctx.strokeStyle = rock.color;
      ctx.shadowColor = rock.color;
      ctx.shadowBlur = 12;
      ctx.lineWidth = 2;
      ctx.beginPath();
      rock.points.forEach((factor, i) => {
        const angle = i / rock.points.length * Math.PI * 2;
        const x = Math.cos(angle) * rock.r * factor;
        const y = Math.sin(angle) * rock.r * factor;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 0.4;
      ctx.beginPath();
      ctx.moveTo(-rock.r * 0.45, -rock.r * 0.2);
      ctx.lineTo(rock.r * 0.1, rock.r * 0.15);
      ctx.lineTo(rock.r * 0.35, -rock.r * 0.4);
      ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    for (const p of particles) {
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.restore();

    drawShip(time);
    drawOverlay();
  }

  function frame(now) {
    const dt = Math.min((now - previousTime) / 1000, 0.033);
    previousTime = now;
    if (state === "playing") update(dt);
    if (state !== "paused") updateParticles(dt);
    draw(dt, now / 1000);
    requestAnimationFrame(frame);
  }

  const controls = new Set([
    "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "KeyP", "KeyR"
  ]);

  window.addEventListener("keydown", event => {
    if (!controls.has(event.code)) return;
    event.preventDefault();

    if (!event.repeat) {
      if (event.code === "KeyR" || (event.code === "Space" && state === "over")) {
        restart();
        return;
      }
      if (event.code === "KeyP" && state !== "over") {
        state = state === "paused" ? "playing" : "paused";
        keys.clear();
        updateHud();
        return;
      }
      if (event.code === "Space" && state === "paused") {
        state = "playing";
        keys.clear();
        updateHud();
      }
    }
    keys.add(event.code);
  });

  window.addEventListener("keyup", event => {
    if (controls.has(event.code)) event.preventDefault();
    keys.delete(event.code);
  });

  function pauseWhenAway() {
    keys.clear();
    if (state === "playing") {
      state = "paused";
      updateHud();
    }
  }
  window.addEventListener("blur", pauseWhenAway);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) pauseWhenAway();
  });
  window.addEventListener("resize", resize);

  resize();
  restart();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
