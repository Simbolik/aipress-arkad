<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON ASTEROIDS</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #05010d;
    overflow: hidden;
    font-family: "Courier New", monospace;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');

  var NEON = ['#00f0ff', '#ff2bd6', '#9d4bff', '#39ff14', '#ffe600'];

  var W = 0, H = 0, DPR = 1;
  var stars = [];

  function makeStars() {
    stars = [];
    var count = Math.max(60, Math.round((W * H) / 9000));
    for (var i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.3 + 0.4,
        speed: Math.random() * 45 + 8,
        a: Math.random() * 0.55 + 0.25
      });
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    makeStars();
  }

  window.addEventListener('resize', resize);

  // ---------- Speltillstånd ----------
  var state, score, lives, bestScore = 0;
  var ship, bullets, asteroids, particles;
  var shootCooldown, spawnTimer, elapsed, shake;

  var keys = {};

  function reset() {
    state = 'play';
    score = 0;
    lives = 3;
    bullets = [];
    asteroids = [];
    particles = [];
    ship = { x: W / 2, y: H - 100, r: 16, speed: 440, invuln: 1.6, tilt: 0 };
    shootCooldown = 0;
    spawnTimer = 0.5;
    elapsed = 0;
    shake = 0;
  }

  function explode(x, y, color, count) {
    for (var i = 0; i < count; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 40 + Math.random() * 280;
      var life = 0.35 + Math.random() * 0.7;
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: life,
        maxLife: life,
        size: 1 + Math.random() * 2.6,
        color: Math.random() < 0.28 ? '#ffffff' : color
      });
    }
  }

  function makeAsteroid(x, y, vx, vy, r, color) {
    var n = 8 + Math.floor(Math.random() * 5);
    var pts = [];
    for (var i = 0; i < n; i++) {
      var ang = (i / n) * Math.PI * 2;
      var rr = r * (0.72 + Math.random() * 0.42);
      pts.push({ x: Math.cos(ang) * rr, y: Math.sin(ang) * rr });
    }
    return {
      x: x, y: y, vx: vx, vy: vy, r: r,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 2.2,
      pts: pts,
      color: color
    };
  }

  function hitShip(a) {
    explode(a.x, a.y, '#ff2bd6', 18);
    if (ship.invuln > 0) return;
    lives--;
    shake = 18;
    ship.invuln = 2;
    if (lives <= 0) {
      lives = 0;
      explode(ship.x, ship.y, '#00f0ff', 45);
      state = 'over';
      if (score > bestScore) bestScore = score;
    }
  }

  // ---------- Input ----------
  window.addEventListener('keydown', function (e) {
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].indexOf(e.code) !== -1) {
      e.preventDefault();
    }
    keys[e.code] = true;
    if (e.code === 'KeyR') {
      reset();
    } else if (state === 'over' && (e.code === 'Space' || e.code === 'Enter')) {
      reset();
    }
  });

  window.addEventListener('keyup', function (e) {
    keys[e.code] = false;
  });

  window.addEventListener('blur', function () {
    for (var k in keys) keys[k] = false;
  });

  // ---------- Uppdatering ----------
  function update(dt) {
    var i, j;

    // Stjärnbackground
    for (i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.y += s.speed * dt * (state === 'play' ? 1 : 0.35);
      if (s.y > H + 2) {
        s.y = -2;
        s.x = Math.random() * W;
      }
    }

    // Partiklar
    for (i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.985;
      p.vy = p.vy * 0.985 + 40 * dt;
    }

    // Skakning avtar
    shake *= Math.pow(0.02, dt);
    if (shake < 0.2) shake = 0;

    if (state !== 'play') return;

    elapsed += dt;
    if (ship.invuln > 0) ship.invuln -= dt;

    // Skeppets rörelse
    var dx = 0, dy = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
    if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
    if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
    if (keys['ArrowDown'] || keys['KeyS']) dy += 1;
    if (dx !== 0 && dy !== 0) {
      dx *= 0.70710678;
      dy *= 0.70710678;
    }
    ship.x += dx * ship.speed * dt;
    ship.y += dy * ship.speed * dt;
    ship.x = Math.max(ship.r + 4, Math.min(W - ship.r - 4, ship.x));
    ship.y = Math.max(ship.r + 4, Math.min(H - ship.r - 4, ship.y));
    ship.tilt = dx;

    // Skjut
    shootCooldown -= dt;
    if (keys['Space'] && shootCooldown <= 0) {
      shootCooldown = 0.14;
      bullets.push({
        x: ship.x,
        y: ship.y - ship.r * 1.3,
        vy: -920,
        r: 2.6
      });
      explode(ship.x, ship.y - ship.r * 1.6, '#00f0ff', 3);
    }

    // Kulor
    for (i = bullets.length - 1; i >= 0; i--) {
      bullets[i].y += bullets[i].vy * dt;
      if (bullets[i].y < -30) bullets.splice(i, 1);
    }

    // Spawna asteroider
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      var diff = Math.min(elapsed / 50, 1);
      spawnTimer = (0.95 - 0.55 * diff) * (0.7 + Math.random() * 0.8);
      var r = 15 + Math.random() * 22;
      var x = r + 10 + Math.random() * Math.max(1, W - 2 * r - 20);
      var vy = 80 + Math.random() * 70 + diff * 130;
      var vx = (Math.random() - 0.5) * 110;
      asteroids.push(makeAsteroid(x, -r - 10, vx, vy, r, NEON[(Math.random() * NEON.length) | 0]));
    }

    // Asteroider
    for (i = asteroids.length - 1; i >= 0; i--) {
      var a = asteroids[i];
      a.x += a.vx * dt;
      a.y += a.vy * dt;
      a.rot += a.rotSpeed * dt;
      if (a.x < a.r) { a.x = a.r; a.vx = Math.abs(a.vx); }
      if (a.x > W - a.r) { a.x = W - a.r; a.vx = -Math.abs(a.vx); }
      if (a.y - a.r > H + 50) asteroids.splice(i, 1);
    }

    // Kollision kula / asteroid
    for (i = bullets.length - 1; i >= 0; i--) {
      var b = bullets[i];
      for (j = asteroids.length - 1; j >= 0; j--) {
        var ast = asteroids[j];
        var ddx = ast.x - b.x;
        var ddy = ast.y - b.y;
        var rad = ast.r + b.r;
        if (ddx * ddx + ddy * ddy < rad * rad) {
          bullets.splice(i, 1);
          explode(ast.x, ast.y, ast.color, Math.round(ast.r * 0.9));
          score += Math.round(130 / Math.sqrt(ast.r));
          asteroids.splice(j, 1);
          break;
        }
      }
    }

    // Kollision skepp / asteroid
    for (i = asteroids.length - 1; i >= 0; i--) {
      var aa = asteroids[i];
      var sx = aa.x - ship.x;
      var sy = aa.y - ship.y;
      var sr = aa.r * 0.82 + ship.r * 0.8;
      if (sx * sx + sy * sy < sr * sr) {
        asteroids.splice(i, 1);
        hitShip(aa);
        if (state !== 'play') return;
      }
    }
  }

  // ---------- Ritning ----------
  function drawShip() {
    if (ship.invuln > 0 && Math.floor(ship.invuln * 12) % 2 === 0) return;

    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.tilt * 0.28);

    // Motorlåga
    var f = 10 + Math.random() * 12;
    ctx.shadowBlur = 22;
    ctx.shadowColor = '#ff2bd6';
    ctx.fillStyle = 'rgba(255,43,214,0.85)';
    ctx.beginPath();
    ctx.moveTo(-5, ship.r * 0.7);
    ctx.lineTo(0, ship.r * 0.7 + f);
    ctx.lineTo(5, ship.r * 0.7);
    ctx.closePath();
    ctx.fill();

    // Skeppskropp
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 18;
    ctx.strokeStyle = '#7ff6ff';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(0, -ship.r * 1.5);
    ctx.lineTo(ship.r, ship.r);
    ctx.lineTo(0, ship.r * 0.5);
    ctx.lineTo(-ship.r, ship.r);
    ctx.closePath();
    ctx.fillStyle = 'rgba(0,240,255,0.13)';
    ctx.fill();
    ctx.stroke();

    // Cockpit
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#e9fdff';
    ctx.beginPath();
    ctx.arc(0, -ship.r * 0.15, 2.6, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function render() {
    var i;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // Bakgrund
    ctx.fillStyle = '#05010d';
    ctx.fillRect(0, 0, W, H);

    // Skakning
    if (shake > 0.2) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    // Neon-glöd i bakgrunden
    var g = ctx.createRadialGradient(W / 2, H * 0.1, 0, W / 2, H * 0.1, Math.max(W, H) * 0.95);
    g.addColorStop(0, 'rgba(70,0,110,0.55)');
    g.addColorStop(0.5, 'rgba(30,0,60,0.25)');
    g.addColorStop(1, 'rgba(5,1,13,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Stjärnor
    ctx.save();
    for (i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.globalAlpha = s.a;
      ctx.fillStyle = s.r > 1.15 ? '#b6f6ff' : '#7a6fa8';
      ctx.fillRect(s.x, s.y, s.r * 1.6, s.r * 1.6);
    }
    ctx.restore();

    // Kulor
    ctx.save();
    ctx.shadowBlur = 16;
    ctx.shadowColor = '#00f0ff';
    ctx.fillStyle = '#d8feff';
    for (i = 0; i < bullets.length; i++) {
      var b = bullets[i];
      ctx.beginPath();
      ctx.ellipse(b.x, b.y, b.r, b.r * 2.8, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // Asteroider
    for (i = 0; i < asteroids.length; i++) {
      var a = asteroids[i];
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(a.rot);
      ctx.beginPath();
      for (var k = 0; k < a.pts.length; k++) {
        if (k === 0) ctx.moveTo(a.pts[k].x, a.pts[k].y);
        else ctx.lineTo(a.pts[k].x, a.pts[k].y);
      }
      ctx.closePath();
      ctx.shadowBlur = 16;
      ctx.shadowColor = a.color;
      ctx.strokeStyle = a.color;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.fill();
      ctx.restore();
    }

    // Partiklar
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      var t = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = t;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * t, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // Skepp
    if (state === 'play') drawShip();

    // HUD
    ctx.save();
    ctx.textBaseline = 'top';
    ctx.font = 'bold 22px "Courier New", monospace';

    ctx.textAlign = 'left';
    ctx.shadowBlur = 14;
    ctx.shadowColor = '#00f0ff';
    ctx.fillStyle = '#8ff9ff';
    ctx.fillText('POÄNG ' + score, 24, 22);

    ctx.textAlign = 'right';
    ctx.shadowColor = '#ff2bd6';
    ctx.fillStyle = '#ff8fe8';
    ctx.fillText('LIV ' + lives, W - 24, 22);

    // Livsikoner
    ctx.shadowBlur = 14;
    ctx.shadowColor = '#ff2bd6';
    ctx.strokeStyle = '#ff8fe8';
    ctx.lineWidth = 2;
    for (i = 0; i < lives; i++) {
      var lx = W - 34 - i * 26;
      var ly = 78;
      ctx.beginPath();
      ctx.moveTo(lx, ly - 10);
      ctx.lineTo(lx + 8, ly + 7);
      ctx.lineTo(lx, ly + 2);
      ctx.lineTo(lx - 8, ly + 7);
      ctx.closePath();
      ctx.stroke();
    }
    ctx.restore();

    // Game over
    if (state === 'over') {
      ctx.save();
      ctx.fillStyle = 'rgba(5,1,13,0.75)';
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.font = 'bold ' + Math.min(72, Math.max(34, W * 0.11)) + 'px "Courier New", monospace';
      ctx.shadowBlur = 30;
      ctx.shadowColor = '#ff2bd6';
      ctx.fillStyle = '#ff6fe0';
      ctx.fillText('GAME OVER', W / 2, H / 2 - 70);

      ctx.font = 'bold 26px "Courier New", monospace';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#9ffbff';
      ctx.fillText('POÄNG: ' + score, W / 2, H / 2 + 5);

      if (bestScore > 0) {
        ctx.font = 'bold 18px "Courier New", monospace';
        ctx.shadowColor = '#9d4bff';
        ctx.shadowBlur = 16;
        ctx.fillStyle = '#b98fff';
        ctx.fillText('BÄSTA: ' + bestScore, W / 2, H / 2 + 45);
      }

      ctx.font = 'bold 17px "Courier New", monospace';
      ctx.shadowColor = '#39ff14';
      ctx.shadowBlur = 14;
      ctx.fillStyle = Math.floor(performance.now() / 480) % 2 ? '#39ff14' : '#1c6b12';
      ctx.fillText('TRYCK SPACE FÖR ATT SPELA IGEN', W / 2, H / 2 + 110);

      ctx.restore();
    }
  }

  // ---------- Spelloop ----------
  var last = 0;

  function loop(t) {
    if (!last) last = t;
    var dt = Math.min((t - last) / 1000, 0.05);
    last = t;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  // ---------- Start ----------
  resize();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
