<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON ASTEROIDS</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #03030b;
    color: #fff;
    font-family: "Courier New", monospace;
  }
  body { user-select: none; }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    padding: 22px 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 0 10px currentColor;
  }
  .label { font-size: 11px; opacity: .7; }
  .value { font-size: 25px; font-weight: bold; }
  #scoreBox { color: #00f6ff; }
  #rightHud { text-align: right; color: #ff2bd6; }
  #lives { letter-spacing: 7px; }
  #wave {
    position: fixed;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    color: #a68bff;
    font-size: 13px;
    letter-spacing: 4px;
  }
  #help {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #7b91aa;
    font-size: 11px;
    letter-spacing: 2px;
    white-space: nowrap;
    pointer-events: none;
    transition: opacity 1s;
  }
  #message {
    position: fixed;
    inset: 0;
    display: none;
    place-content: center;
    text-align: center;
    pointer-events: none;
    background: radial-gradient(circle, rgba(13,4,30,.25), rgba(0,0,0,.65));
  }
  #message h1 {
    margin: 0;
    color: #ff2bd6;
    font-size: clamp(36px, 8vw, 80px);
    letter-spacing: 8px;
    text-shadow: 0 0 8px #ff2bd6, 0 0 35px #ff2bd6;
  }
  #message p {
    color: #00f6ff;
    letter-spacing: 4px;
    line-height: 2;
    text-shadow: 0 0 10px #00f6ff;
  }
  #scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .12;
    background: repeating-linear-gradient(
      0deg, transparent 0, transparent 3px, #000 3px, #000 4px
    );
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="scoreBox">
    <div class="label">Poäng</div>
    <div class="value" id="score">000000</div>
  </div>
  <div id="rightHud">
    <div class="label">Liv</div>
    <div class="value" id="lives">◆ ◆ ◆</div>
  </div>
</div>
<div id="wave">SEKTOR 01</div>
<div id="help">PILARNA: STYR &nbsp;•&nbsp; MELLANLAG: SKJUT &nbsp;•&nbsp; P: PAUS</div>
<div id="message">
  <h1>GAME OVER</h1>
  <p id="finalScore"></p>
  <p>TRYCK R FÖR ATT STARTA OM</p>
</div>
<div id="scanlines"></div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const livesEl = document.getElementById("lives");
  const waveEl = document.getElementById("wave");
  const messageEl = document.getElementById("message");
  const finalScoreEl = document.getElementById("finalScore");
  const helpEl = document.getElementById("help");

  let W = innerWidth, H = innerHeight, dpr = 1;
  let stars = [], asteroids = [], bullets = [], particles = [];
  let score = 0, lives = 3, wave = 1;
  let gameOver = false, paused = false;
  let lastTime = performance.now(), fireTimer = 0, respawnTimer = 0;
  let elapsed = 0;
  const keys = {};
  const TAU = Math.PI * 2;

  const ship = {
    x: W / 2, y: H / 2, vx: 0, vy: 0,
    angle: -Math.PI / 2, radius: 13,
    active: true, invincible: 2.5, thrusting: false
  };

  function resize() {
    W = innerWidth;
    H = innerHeight;
    dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    createStars();
  }

  function createStars() {
    const count = Math.floor(W * H / 6500);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() * 1.6 + .3,
      speed: Math.random() * 9 + 2,
      phase: Math.random() * TAU,
      color: Math.random() < .18 ? "#ff4fd8" : "#6edcff"
    }));
  }

  function wrap(obj) {
    const margin = obj.radius || 2;
    if (obj.x < -margin) obj.x = W + margin;
    if (obj.x > W + margin) obj.x = -margin;
    if (obj.y < -margin) obj.y = H + margin;
    if (obj.y > H + margin) obj.y = -margin;
  }

  function resetShip() {
    ship.x = W / 2;
    ship.y = H / 2;
    ship.vx = ship.vy = 0;
    ship.angle = -Math.PI / 2;
    ship.active = true;
    ship.invincible = 2.5;
  }

  function makeAsteroid(x, y, size = 3) {
    const radius = size === 3 ? 48 : size === 2 ? 30 : 17;
    const angle = Math.random() * TAU;
    const speed = (25 + Math.random() * 45) + wave * 3;
    const vertices = 9 + Math.floor(Math.random() * 5);
    const shape = Array.from({ length: vertices }, () => .72 + Math.random() * .32);
    return {
      x, y, radius, size, shape,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      angle: Math.random() * TAU,
      spin: (Math.random() - .5) * 1.3,
      hue: Math.random() < .5 ? "#ff2bd6" : "#8b5cff"
    };
  }

  function spawnWave() {
    const count = Math.min(3 + wave, 10);
    for (let i = 0; i < count; i++) {
      let x, y;
      do {
        x = Math.random() * W;
        y = Math.random() * H;
      } while (Math.hypot(x - ship.x, y - ship.y) < 180);
      asteroids.push(makeAsteroid(x, y));
    }
    waveEl.textContent = "SEKTOR " + String(wave).padStart(2, "0");
  }

  function burst(x, y, color, amount = 20, power = 160) {
    for (let i = 0; i < amount; i++) {
      const a = Math.random() * TAU;
      const speed = Math.random() * power + 20;
      particles.push({
        x, y,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed,
        life: .35 + Math.random() * .65,
        maxLife: 1,
        size: Math.random() * 2.5 + 1,
        color
      });
    }
  }

  function shoot() {
    if (!ship.active || fireTimer > 0 || gameOver || paused) return;
    const noseX = ship.x + Math.cos(ship.angle) * 20;
    const noseY = ship.y + Math.sin(ship.angle) * 20;
    bullets.push({
      x: noseX, y: noseY,
      vx: Math.cos(ship.angle) * 520 + ship.vx,
      vy: Math.sin(ship.angle) * 520 + ship.vy,
      life: 1.05, radius: 2
    });
    fireTimer = .16;
    burst(noseX, noseY, "#00f6ff", 4, 45);
  }

  function destroyShip() {
    if (!ship.active || ship.invincible > 0) return;
    burst(ship.x, ship.y, "#00f6ff", 35, 230);
    burst(ship.x, ship.y, "#ff2bd6", 25, 180);
    ship.active = false;
    lives--;
    updateHud();
    if (lives <= 0) {
      gameOver = true;
      finalScoreEl.textContent = "SLUTPOÄNG: " + score;
      messageEl.style.display = "grid";
    } else {
      respawnTimer = 1.5;
    }
  }

  function updateHud() {
    scoreEl.textContent = String(score).padStart(6, "0");
    livesEl.textContent = lives > 0 ? Array(lives).fill("◆").join(" ") : "—";
  }

  function restart() {
    score = 0;
    lives = 3;
    wave = 1;
    asteroids = [];
    bullets = [];
    particles = [];
    gameOver = false;
    paused = false;
    respawnTimer = 0;
    messageEl.style.display = "none";
    resetShip();
    spawnWave();
    updateHud();
  }

  function update(dt) {
    elapsed += dt;
    fireTimer = Math.max(0, fireTimer - dt);

    stars.forEach(s => {
      s.y += s.speed * dt;
      if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    });

    particles.forEach(p => {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= Math.pow(.25, dt);
      p.vy *= Math.pow(.25, dt);
      p.life -= dt;
    });
    particles = particles.filter(p => p.life > 0);

    if (gameOver) return;

    if (keys.Space) shoot();

    if (ship.active) {
      ship.invincible = Math.max(0, ship.invincible - dt);
      if (keys.ArrowLeft) ship.angle -= 3.8 * dt;
      if (keys.ArrowRight) ship.angle += 3.8 * dt;

      ship.thrusting = !!keys.ArrowUp;
      if (ship.thrusting) {
        ship.vx += Math.cos(ship.angle) * 260 * dt;
        ship.vy += Math.sin(ship.angle) * 260 * dt;
        if (Math.random() < .8) {
          const back = ship.angle + Math.PI;
          particles.push({
            x: ship.x + Math.cos(back) * 13,
            y: ship.y + Math.sin(back) * 13,
            vx: Math.cos(back + (Math.random() - .5) * .5) * 100 + ship.vx,
            vy: Math.sin(back + (Math.random() - .5) * .5) * 100 + ship.vy,
            life: .25 + Math.random() * .2, maxLife: .45,
            size: 2, color: Math.random() < .5 ? "#00f6ff" : "#ff2bd6"
          });
        }
      }
      if (keys.ArrowDown) {
        ship.vx *= Math.pow(.08, dt);
        ship.vy *= Math.pow(.08, dt);
      }

      const drag = Math.pow(.45, dt);
      ship.vx *= drag;
      ship.vy *= drag;
      const speed = Math.hypot(ship.vx, ship.vy);
      if (speed > 330) {
        ship.vx *= 330 / speed;
        ship.vy *= 330 / speed;
      }
      ship.x += ship.vx * dt;
      ship.y += ship.vy * dt;
      wrap(ship);
    } else if (respawnTimer > 0) {
      respawnTimer -= dt;
      if (respawnTimer <= 0) resetShip();
    }

    bullets.forEach(b => {
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      wrap(b);
    });
    bullets = bullets.filter(b => b.life > 0);

    asteroids.forEach(a => {
      a.x += a.vx * dt;
      a.y += a.vy * dt;
      a.angle += a.spin * dt;
      wrap(a);
    });

    for (let bi = bullets.length - 1; bi >= 0; bi--) {
      const b = bullets[bi];
      for (let ai = asteroids.length - 1; ai >= 0; ai--) {
        const a = asteroids[ai];
        if (Math.hypot(b.x - a.x, b.y - a.y) < a.radius) {
          bullets.splice(bi, 1);
          asteroids.splice(ai, 1);
          score += a.size === 3 ? 20 : a.size === 2 ? 50 : 100;
          updateHud();
          burst(b.x, b.y, a.hue, a.size * 7, 150);
          if (a.size > 1) {
            for (let n = 0; n < 2; n++) {
              const child = makeAsteroid(a.x, a.y, a.size - 1);
              child.vx += a.vx * .5;
              child.vy += a.vy * .5;
              asteroids.push(child);
            }
          }
          break;
        }
      }
    }

    if (ship.active && ship.invincible <= 0) {
      for (const a of asteroids) {
        if (Math.hypot(ship.x - a.x, ship.y - a.y) < ship.radius + a.radius * .8) {
          destroyShip();
          break;
        }
      }
    }

    if (asteroids.length === 0 && !gameOver) {
      wave++;
      score += 250;
      updateHud();
      spawnWave();
    }
  }

  function drawBackground() {
    ctx.fillStyle = "#03030b";
    ctx.fillRect(0, 0, W, H);

    const glow = ctx.createRadialGradient(W * .5, H * .5, 0, W * .5, H * .5, Math.max(W, H) * .7);
    glow.addColorStop(0, "rgba(31,7,55,.38)");
    glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.strokeStyle = "rgba(84,34,130,.09)";
    ctx.lineWidth = 1;
    const grid = 70;
    const offset = (elapsed * 8) % grid;
    for (let x = -grid; x < W + grid; x += grid) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = -grid + offset; y < H + grid; y += grid) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.restore();

    for (const s of stars) {
      ctx.globalAlpha = .35 + Math.sin(elapsed * 2 + s.phase) * .25;
      ctx.fillStyle = s.color;
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawShip() {
    if (!ship.active) return;
    if (ship.invincible > 0 && Math.floor(ship.invincible * 12) % 2 === 0) return;

    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.angle);
    ctx.shadowBlur = 16;
    ctx.shadowColor = "#00f6ff";
    ctx.strokeStyle = "#00f6ff";
    ctx.lineWidth = 2;
    ctx.fillStyle = "rgba(0,246,255,.07)";
    ctx.beginPath();
    ctx.moveTo(21, 0);
    ctx.lineTo(-13, -12);
    ctx.lineTo(-7, 0);
    ctx.lineTo(-13, 12);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.shadowColor = "#ff2bd6";
    ctx.strokeStyle = "#ff2bd6";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-7, 0);
    ctx.lineTo(8, 0);
    ctx.stroke();

    if (ship.thrusting) {
      ctx.shadowColor = "#ff2bd6";
      ctx.strokeStyle = "#ff80e8";
      ctx.beginPath();
      ctx.moveTo(-10, -5);
      ctx.lineTo(-20 - Math.random() * 9, 0);
      ctx.lineTo(-10, 5);
      ctx.stroke();
    }
    ctx.restore();

    if (ship.invincible > 0) {
      ctx.save();
      ctx.strokeStyle = "rgba(0,246,255,.35)";
      ctx.shadowColor = "#00f6ff";
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(ship.x, ship.y, 27 + Math.sin(elapsed * 8) * 2, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }
  }

  function draw() {
    drawBackground();
    ctx.save();
    ctx.globalCompositeOperation = "lighter";

    for (const p of particles) {
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    for (const b of bullets) {
      ctx.strokeStyle = "#00f6ff";
      ctx.shadowColor = "#00f6ff";
      ctx.shadowBlur = 14;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - b.vx * .025, b.y - b.vy * .025);
      ctx.stroke();
    }

    for (const a of asteroids) {
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(a.angle);
      ctx.strokeStyle = a.hue;
      ctx.shadowColor = a.hue;
      ctx.shadowBlur = 12;
      ctx.lineWidth = 1.7;
      ctx.fillStyle = "rgba(25,5,40,.35)";
      ctx.beginPath();
      a.shape.forEach((scale, i) => {
        const angle = i / a.shape.length * TAU;
        const x = Math.cos(angle) * a.radius * scale;
        const y = Math.sin(angle) * a.radius * scale;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.globalAlpha = .35;
      ctx.beginPath();
      ctx.moveTo(-a.radius * .3, -a.radius * .2);
      ctx.lineTo(a.radius * .1, -a.radius * .45);
      ctx.lineTo(a.radius * .35, -.05 * a.radius);
      ctx.stroke();
      ctx.restore();
    }

    drawShip();
    ctx.restore();

    if (paused && !gameOver) {
      ctx.fillStyle = "rgba(0,0,0,.55)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = "#00f6ff";
      ctx.shadowColor = "#00f6ff";
      ctx.shadowBlur = 20;
      ctx.font = "bold 38px Courier New";
      ctx.fillText("PAUS", W / 2, H / 2);
      ctx.font = "13px Courier New";
      ctx.fillText("TRYCK P FÖR ATT FORTSÄTTA", W / 2, H / 2 + 38);
      ctx.shadowBlur = 0;
    }
  }

  function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, .033);
    lastTime = now;
    if (!paused) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  addEventListener("keydown", e => {
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) {
      e.preventDefault();
    }
    keys[e.code] = true;
    helpEl.style.opacity = ".25";
    if (e.code === "KeyR" && gameOver) restart();
    if (e.code === "KeyP" && !gameOver && !e.repeat) paused = !paused;
  });

  addEventListener("keyup", e => { keys[e.code] = false; });
  addEventListener("blur", () => {
    Object.keys(keys).forEach(k => keys[k] = false);
    if (!gameOver) paused = true;
  });
  addEventListener("resize", resize);

  resize();
  resetShip();
  spawnWave();
  updateHud();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
