<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Asteroids</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at center, #17203c, #070912 70%);
      color: #dff;
      font-family: system-ui, sans-serif;
    }
    .frame {
      width: min(96vw, 900px);
      padding: 10px;
      border: 2px solid #24f7ff;
      border-radius: 12px;
      background: #090d1d;
      box-shadow: 0 0 20px #00eaff88, 0 0 60px #e92bff44;
    }
    canvas { display: block; width: 100%; height: auto; }
    p { margin: 10px 0 0; text-align: center; font-size: 14px; color: #9db6ce; }
  </style>
</head>
<body>
  <div class="frame">
    <canvas id="game" width="800" height="600" aria-label="Rymdspel"></canvas>
    <p>Piltangenter: styr · Mellanslag: skjut · Enter: spela igen</p>
  </div>

  <script>
    "use strict";

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    const keys = new Set();
    const stars = Array.from({ length: 90 }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 35 + 15
    }));

    let ship, bullets, asteroids, particles, score, lives, spawnTimer, shootTimer, invincible, gameOver;

    function reset() {
      ship = { x: W / 2, y: H - 75, radius: 17 };
      bullets = [];
      asteroids = [];
      particles = [];
      score = 0;
      lives = 3;
      spawnTimer = 0;
      shootTimer = 0;
      invincible = 0;
      gameOver = false;
    }

    function burst(x, y, color, count = 14) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 50 + Math.random() * 170;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.35 + Math.random() * 0.45,
          color
        });
      }
    }

    function spawnAsteroid() {
      const radius = 19 + Math.random() * 27;
      asteroids.push({
        x: radius + Math.random() * (W - radius * 2),
        y: -radius,
        radius,
        vx: (Math.random() - 0.5) * 65,
        vy: 90 + Math.random() * 75 + Math.min(score * 0.12, 90),
        angle: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 2,
        corners: Array.from({ length: 9 }, () => 0.78 + Math.random() * 0.4)
      });
    }

    function update(dt) {
      for (const star of stars) {
        star.y += star.speed * dt;
        if (star.y > H) { star.y = 0; star.x = Math.random() * W; }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      if (gameOver) return;

      invincible = Math.max(0, invincible - dt);
      shootTimer -= dt;
      spawnTimer -= dt;

      const dx = Number(keys.has("ArrowRight")) - Number(keys.has("ArrowLeft"));
      const dy = Number(keys.has("ArrowDown")) - Number(keys.has("ArrowUp"));
      const length = Math.hypot(dx, dy) || 1;
      ship.x = Math.max(22, Math.min(W - 22, ship.x + dx / length * 300 * dt));
      ship.y = Math.max(65, Math.min(H - 25, ship.y + dy / length * 300 * dt));

      if (keys.has("Space") && shootTimer <= 0) {
        bullets.push({ x: ship.x, y: ship.y - 22 });
        shootTimer = 0.16;
      }

      if (spawnTimer <= 0) {
        spawnAsteroid();
        spawnTimer = Math.max(0.28, 0.85 - score / 1800);
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= 560 * dt;
        if (bullets[i].y < -15) bullets.splice(i, 1);
      }

      for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        a.x += a.vx * dt;
        a.y += a.vy * dt;
        a.angle += a.spin * dt;

        if (a.x < a.radius || a.x > W - a.radius) a.vx *= -1;

        let destroyed = false;
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (Math.hypot(a.x - b.x, a.y - b.y) < a.radius + 5) {
            bullets.splice(j, 1);
            asteroids.splice(i, 1);
            burst(a.x, a.y, "#ff39d4");
            score += 10;
            destroyed = true;
            break;
          }
        }
        if (destroyed) continue;

        if (invincible <= 0 && Math.hypot(a.x - ship.x, a.y - ship.y) < a.radius + ship.radius) {
          asteroids.splice(i, 1);
          burst(ship.x, ship.y, "#20f7ff", 22);
          lives--;
          invincible = 1.5;
          if (lives <= 0) gameOver = true;
        } else if (a.y > H + a.radius) {
          asteroids.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.fillStyle = "#080b1b";
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = "#1a2850";
      ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (let y = 0; y < H; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      for (const star of stars) {
        ctx.fillStyle = "#9edbff";
        ctx.globalAlpha = 0.35 + star.size / 3;
        ctx.fillRect(star.x, star.y, star.size, star.size);
      }
      ctx.globalAlpha = 1;

      ctx.shadowBlur = 18;
      ctx.shadowColor = "#ff39d4";
      ctx.strokeStyle = "#ff39d4";
      ctx.lineWidth = 3;
      for (const a of asteroids) {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.angle);
        ctx.beginPath();
        a.corners.forEach((scale, i) => {
          const angle = i / a.corners.length * Math.PI * 2;
          const x = Math.cos(angle) * a.radius * scale;
          const y = Math.sin(angle) * a.radius * scale;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      }

      ctx.shadowColor = "#ffe95b";
      ctx.fillStyle = "#ffe95b";
      for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 10, 4, 14);

      for (const p of particles) {
        ctx.globalAlpha = Math.min(1, p.life * 2);
        ctx.shadowColor = p.color;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
      }
      ctx.globalAlpha = 1;

      if (!gameOver && (invincible <= 0 || Math.floor(invincible * 10) % 2 === 0)) {
        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.shadowColor = "#20f7ff";
        ctx.strokeStyle = "#20f7ff";
        ctx.fillStyle = "#102941";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, -22);
        ctx.lineTo(17, 18);
        ctx.lineTo(0, 10);
        ctx.lineTo(-17, 18);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#ff39d4";
        ctx.shadowColor = "#ff39d4";
        ctx.fillRect(-4, 14, 8, 12 + Math.random() * 8);
        ctx.restore();
      }

      ctx.shadowBlur = 12;
      ctx.shadowColor = "#20f7ff";
      ctx.fillStyle = "#dfffff";
      ctx.font = "bold 23px system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("POÄNG  " + score, 24, 37);
      ctx.textAlign = "right";
      ctx.fillText("LIV  " + lives, W - 24, 37);
      ctx.shadowBlur = 0;

      if (gameOver) {
        ctx.fillStyle = "#050817cc";
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = "center";
        ctx.shadowBlur = 25;
        ctx.shadowColor = "#ff39d4";
        ctx.fillStyle = "#ff39d4";
        ctx.font = "bold 58px system-ui, sans-serif";
        ctx.fillText("GAME OVER", W / 2, H / 2 - 25);
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#dfffff";
        ctx.font = "22px system-ui, sans-serif";
        ctx.fillText("Poäng: " + score, W / 2, H / 2 + 20);
        ctx.fillText("Tryck Enter för att spela igen", W / 2, H / 2 + 62);
      }
    }

    window.addEventListener("keydown", event => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(event.code)) {
        event.preventDefault();
        keys.add(event.code);
      }
      if (event.code === "Enter" && gameOver) reset();
    });
    window.addEventListener("keyup", event => keys.delete(event.code));
    window.addEventListener("blur", () => keys.clear());

    reset();
    let lastTime = performance.now();
    function frame(time) {
      const dt = Math.min((time - lastTime) / 1000, 0.05);
      lastTime = time;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
