<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEON DRIFT</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 20%, #251044 0%, transparent 55%),
        #080812;
      color: #e9faff;
    }

    main {
      width: min(480px, 100vw);
      padding: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      margin-bottom: 10px;
      text-shadow: 0 0 12px #00f5ff;
    }

    h1 {
      margin: 0;
      color: #00f5ff;
      font-size: 1.5rem;
      letter-spacing: .18em;
    }

    .stats {
      display: flex;
      gap: 18px;
      font-size: .8rem;
      letter-spacing: .12em;
      text-align: right;
    }

    .stats strong {
      display: block;
      margin-top: 2px;
      color: #ff4fd8;
      font-size: 1.2rem;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #090b1c;
      border: 2px solid #4d2a78;
      box-shadow: 0 0 25px #a020f055, inset 0 0 25px #00f5ff22;
    }

    p {
      margin: 10px 0 0;
      color: #a9a4c7;
      font-size: .82rem;
      text-align: center;
      letter-spacing: .04em;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>NEON DRIFT</h1>
      <div class="stats">
        <div>POÄNG<strong id="score">0</strong></div>
        <div>LIV<strong id="lives">3</strong></div>
      </div>
    </header>
    <canvas id="game" width="480" height="720" aria-label="Rymdspel: skjut asteroider"></canvas>
    <p>Piltangenter: styr · Mellanslag: skjut · Enter: starta om</p>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const livesEl = document.getElementById("lives");
      const W = canvas.width;
      const H = canvas.height;
      const keys = new Set();
      const stars = Array.from({ length: 85 }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        size: Math.random() * 1.6 + 0.4,
        speed: Math.random() * 45 + 15
      }));

      let ship, bullets, asteroids, particles;
      let score, lives, spawnTimer, shotTimer, invulnerable, gameOver;
      let lastTime = performance.now();

      function reset() {
        ship = { x: W / 2, y: H - 80 };
        bullets = [];
        asteroids = [];
        particles = [];
        score = 0;
        lives = 3;
        spawnTimer = 0.5;
        shotTimer = 0;
        invulnerable = 0;
        gameOver = false;
        scoreEl.textContent = score;
        livesEl.textContent = lives;
      }

      function burst(x, y, color, count = 12) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 150 + 40;
          particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: Math.random() * 0.4 + 0.3,
            color
          });
        }
      }

      function spawnAsteroid() {
        const radius = Math.random() * 19 + 17;
        asteroids.push({
          x: radius + Math.random() * (W - radius * 2),
          y: -radius,
          radius,
          speed: Math.random() * 55 + 85 + Math.min(score * 0.4, 90),
          drift: (Math.random() - 0.5) * 45,
          angle: Math.random() * Math.PI * 2,
          spin: (Math.random() - 0.5) * 2,
          corners: Array.from({ length: 9 }, () => 0.72 + Math.random() * 0.28)
        });
      }

      function shoot() {
        bullets.push({ x: ship.x, y: ship.y - 22 });
        burst(ship.x, ship.y - 24, "#00f5ff", 3);
      }

      function update(dt) {
        for (const star of stars) {
          star.y += star.speed * dt;
          if (star.y > H) {
            star.y = 0;
            star.x = Math.random() * W;
          }
        }

        for (const p of particles) {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
        }
        particles = particles.filter(p => p.life > 0);

        if (gameOver) return;

        let dx = Number(keys.has("ArrowRight")) - Number(keys.has("ArrowLeft"));
        let dy = Number(keys.has("ArrowDown")) - Number(keys.has("ArrowUp"));
        const length = Math.hypot(dx, dy) || 1;
        ship.x = Math.max(22, Math.min(W - 22, ship.x + dx / length * 285 * dt));
        ship.y = Math.max(32, Math.min(H - 32, ship.y + dy / length * 285 * dt));

        shotTimer -= dt;
        if (keys.has("Space") && shotTimer <= 0) {
          shoot();
          shotTimer = 0.16;
        }

        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnAsteroid();
          spawnTimer = Math.max(0.38, 0.9 - score * 0.004) * (0.7 + Math.random() * 0.6);
        }

        invulnerable = Math.max(0, invulnerable - dt);

        for (const b of bullets) b.y -= 520 * dt;
        bullets = bullets.filter(b => b.y > -20);

        for (const a of asteroids) {
          a.y += a.speed * dt;
          a.x += a.drift * dt;
          a.angle += a.spin * dt;
          if (a.x < a.radius || a.x > W - a.radius) a.drift *= -1;
        }
        asteroids = asteroids.filter(a => a.y < H + a.radius);

        for (let i = asteroids.length - 1; i >= 0; i--) {
          const a = asteroids[i];
          let destroyed = false;

          for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j];
            if (Math.hypot(a.x - b.x, a.y - b.y) < a.radius + 5) {
              bullets.splice(j, 1);
              asteroids.splice(i, 1);
              burst(a.x, a.y, "#ff4fd8", 18);
              score += 10;
              scoreEl.textContent = score;
              destroyed = true;
              break;
            }
          }

          if (destroyed) continue;

          if (invulnerable <= 0 &&
              Math.hypot(a.x - ship.x, a.y - ship.y) < a.radius + 15) {
            asteroids.splice(i, 1);
            burst(ship.x, ship.y, "#00f5ff", 24);
            lives--;
            livesEl.textContent = lives;
            invulnerable = 1.5;
            if (lives <= 0) gameOver = true;
          }
        }
      }

      function drawBackground(time) {
        ctx.fillStyle = "#090b1c";
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = "#8227b226";
        ctx.lineWidth = 1;
        const offset = (time * 25) % 48;
        for (let y = offset; y < H; y += 48) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y);
          ctx.stroke();
        }
        for (let x = 0; x < W; x += 48) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, H);
          ctx.stroke();
        }

        ctx.fillStyle = "#9ceeff";
        for (const star of stars) {
          ctx.globalAlpha = 0.35 + star.size / 3;
          ctx.fillRect(star.x, star.y, star.size, star.size);
        }
        ctx.globalAlpha = 1;
      }

      function drawShip(time) {
        if (invulnerable > 0 && Math.floor(time * 12) % 2 === 0) return;

        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.shadowColor = "#00f5ff";
        ctx.shadowBlur = 22;
        ctx.fillStyle = "#00f5ff";
        ctx.beginPath();
        ctx.moveTo(0, -23);
        ctx.lineTo(18, 18);
        ctx.lineTo(0, 10);
        ctx.lineTo(-18, 18);
        ctx.closePath();
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = "#111329";
        ctx.beginPath();
        ctx.moveTo(0, -12);
        ctx.lineTo(7, 9);
        ctx.lineTo(-7, 9);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#ff4fd8";
        ctx.shadowColor = "#ff4fd8";
        ctx.shadowBlur = 18;
        ctx.fillRect(-5, 16, 10, 8 + Math.random() * 9);
        ctx.restore();
      }

      function drawAsteroid(a) {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.angle);
        ctx.strokeStyle = "#ff4fd8";
        ctx.fillStyle = "#291332";
        ctx.lineWidth = 3;
        ctx.shadowColor = "#ff4fd8";
        ctx.shadowBlur = 16;
        ctx.beginPath();
        a.corners.forEach((scale, i) => {
          const angle = i / a.corners.length * Math.PI * 2;
          const x = Math.cos(angle) * a.radius * scale;
          const y = Math.sin(angle) * a.radius * scale;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      function draw(time) {
        drawBackground(time);

        ctx.save();
        ctx.strokeStyle = "#00f5ff";
        ctx.lineWidth = 4;
        ctx.shadowColor = "#00f5ff";
        ctx.shadowBlur = 18;
        for (const b of bullets) {
          ctx.beginPath();
          ctx.moveTo(b.x, b.y + 8);
          ctx.lineTo(b.x, b.y - 8);
          ctx.stroke();
        }
        ctx.restore();

        for (const a of asteroids) drawAsteroid(a);

        for (const p of particles) {
          ctx.globalAlpha = Math.min(1, p.life * 2);
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 10;
          ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;

        if (!gameOver) drawShip(time);

        if (gameOver) {
          ctx.fillStyle = "#080812cc";
          ctx.fillRect(0, 0, W, H);
          ctx.textAlign = "center";
          ctx.shadowColor = "#ff4fd8";
          ctx.shadowBlur = 22;
          ctx.fillStyle = "#ff4fd8";
          ctx.font = "bold 44px system-ui";
          ctx.fillText("GAME OVER", W / 2, H / 2 - 25);
          ctx.shadowBlur = 0;
          ctx.fillStyle = "#e9faff";
          ctx.font = "20px system-ui";
          ctx.fillText(`Poäng: ${score}`, W / 2, H / 2 + 15);
          ctx.font = "16px system-ui";
          ctx.fillText("Tryck Enter för att spela igen", W / 2, H / 2 + 58);
        }
      }

      function frame(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;
        update(dt);
        draw(now / 1000);
        requestAnimationFrame(frame);
      }

      window.addEventListener("keydown", event => {
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(event.code)) {
          event.preventDefault();
        }
        if (event.code === "Enter" && gameOver) reset();
        keys.add(event.code);
      });

      window.addEventListener("keyup", event => keys.delete(event.code));
      window.addEventListener("blur", () => keys.clear());

      reset();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
