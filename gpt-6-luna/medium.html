<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Asteroids</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #050510; color: #dffcff;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  body { display: grid; place-items: center; }
  canvas {
    display: block; width: min(100vw, 1100px); height: min(100vh, 720px);
    border: 1px solid #15384c; background: #070817;
    box-shadow: 0 0 35px #00eaff24, inset 0 0 30px #000;
  }
  #hud {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    width: min(100% - 36px, 1060px); display: flex;
    justify-content: space-between; align-items: center; pointer-events: none;
    text-transform: uppercase; letter-spacing: .12em; font-size: 13px;
    text-shadow: 0 0 10px #00eaff;
  }
  .label { color: #6e9cae; font-size: 10px; display: block; margin-bottom: 5px; }
  .value { color: #eaffff; font-size: 18px; }
  #lives { color: #ff4de1; text-shadow: 0 0 10px #ff4de1; }
  #title { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); color: #ff4de1; letter-spacing: .25em; font-size: 11px; }
  #overlay {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #05051099; text-align: center; padding: 24px;
  }
  #panel {
    max-width: 480px; padding: 30px 34px; border: 1px solid #00eaff99;
    background: #080a1bee; box-shadow: 0 0 35px #00eaff22;
  }
  h1 { margin: 0 0 12px; color: #ff4de1; letter-spacing: .14em; font-size: clamp(24px, 5vw, 38px); text-shadow: 0 0 15px #ff4de1; }
  p { color: #a9c8d6; line-height: 1.6; }
  button {
    margin-top: 12px; padding: 12px 22px; border: 1px solid #00eaff;
    color: #00eaff; background: transparent; font: inherit; text-transform: uppercase;
    letter-spacing: .15em; cursor: pointer; box-shadow: 0 0 16px #00eaff22;
  }
  button:hover { color: #050510; background: #00eaff; }
  .small { font-size: 11px; color: #698797; }
  @media (max-width: 560px) { #title { top: 68px; } #hud { top: 14px; } }
</style>
</head>
<body>
<canvas id="game" aria-label="Neon Asteroids"></canvas>
<div id="title">NEON ASTEROIDS // SEKTOR 07</div>
<div id="hud">
  <div><span class="label">Poäng</span><span class="value" id="score">000000</span></div>
  <div style="text-align:right"><span class="label">Liv</span><span class="value" id="lives">♥ ♥ ♥</span></div>
</div>
<div id="overlay">
  <div id="panel">
    <h1 id="heading">NEON ASTEROIDS</h1>
    <p id="message">Styr skeppet genom asteroidfältet.<br>Överlev så länge du kan.</p>
    <p class="small">PILTANGENTER: FLYTTA &nbsp; · &nbsp; MELLANSLAG: SKJUT</p>
    <button id="start">Starta spelet</button>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const livesEl = document.getElementById("lives");
  const overlay = document.getElementById("overlay");
  const heading = document.getElementById("heading");
  const message = document.getElementById("message");
  const startBtn = document.getElementById("start");

  let w, h, dpr, last = 0, running = false, score = 0, lives = 3;
  let ship, bullets = [], rocks = [], particles = [], stars = [];
  const keys = new Set();

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = canvas.clientWidth; h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({length: Math.floor(w * h / 6500)}, () => ({
      x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.4+.3,
      a: Math.random()*.65+.2, phase: Math.random()*6
    }));
    if (ship) { ship.x = Math.min(ship.x, w); ship.y = Math.min(ship.y, h); }
  }
  addEventListener("resize", resize);
  resize();

  function newShip() {
    return { x:w/2, y:h/2, angle:-Math.PI/2, vx:0, vy:0, cooldown:0, invuln:1.8 };
  }
  function spawnRock(x, y, radius, speed) {
    const n = Math.floor(Math.random()*5)+8, points = [];
    for (let i=0;i<n;i++) points.push(.76+Math.random()*.42);
    const a = Math.random()*Math.PI*2, v = speed || 35+Math.random()*45;
    rocks.push({x,y,r:radius,angle:Math.random()*6,spin:(Math.random()-.5)*.9,
      vx:Math.cos(a)*v,vy:Math.sin(a)*v,n,points});
  }
  function reset() {
    score=0; lives=3; bullets=[]; rocks=[]; particles=[]; ship=newShip();
    for(let i=0;i<5;i++) {
      let x,y;
      do { x=Math.random()*w; y=Math.random()*h; }
      while(Math.hypot(x-w/2,y-h/2)<Math.min(w,h)*.25);
      spawnRock(x,y,32+Math.random()*13);
    }
    updateHud();
  }
  function updateHud() {
    scoreEl.textContent=String(score).padStart(6,"0");
    livesEl.textContent=Array.from({length:lives},()=> "♥").join(" ") || "—";
  }
  function wrap(obj) {
    const pad = obj.r || 8;
    if(obj.x < -pad) obj.x=w+pad;
    if(obj.x > w+pad) obj.x=-pad;
    if(obj.y < -pad) obj.y=h+pad;
    if(obj.y > h+pad) obj.y=-pad;
  }
  function burst(x,y,color,count=12) {
    for(let i=0;i<count;i++) {
      const a=Math.random()*Math.PI*2, s=25+Math.random()*150;
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.6,max:.95,color});
    }
  }
  function shoot() {
    if(ship.cooldown>0) return;
    ship.cooldown=.2;
    const a=ship.angle, nose=ship.r||14;
    bullets.push({x:ship.x+Math.cos(a)*nose,y:ship.y+Math.sin(a)*nose,
      vx:ship.vx+Math.cos(a)*440,vy:ship.vy+Math.sin(a)*440,life:1.1});
  }

  function update(dt) {
    if(!running) return;
    if(keys.has("ArrowLeft")) ship.angle-=3.8*dt;
    if(keys.has("ArrowRight")) ship.angle+=3.8*dt;
    if(keys.has("ArrowUp")) {
      ship.vx+=Math.cos(ship.angle)*230*dt;
      ship.vy+=Math.sin(ship.angle)*230*dt;
    }
    if(keys.has("ArrowDown")) {
      ship.vx-=Math.cos(ship.angle)*130*dt;
      ship.vy-=Math.sin(ship.angle)*130*dt;
    }
    const drag=Math.pow(.985,dt*60);
    ship.vx*=drag; ship.vy*=drag;
    const max=270, speed=Math.hypot(ship.vx,ship.vy);
    if(speed>max){ship.vx*=max/speed;ship.vy*=max/speed;}
    ship.x+=ship.vx*dt; ship.y+=ship.vy*dt; wrap(ship);
    ship.cooldown-=dt; ship.invuln-=dt;
    if(keys.has(" ")) shoot();

    for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;wrap(b);}
    bullets=bullets.filter(b=>b.life>0);
    for(const r of rocks){r.x+=r.vx*dt;r.y+=r.vy*dt;r.angle+=r.spin*dt;wrap(r);}
    for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;p.vy*=.98;p.life-=dt;}
    particles=particles.filter(p=>p.life>0);

    for(let bi=bullets.length-1;bi>=0;bi--){
      const b=bullets[bi]; let hit=-1;
      for(let ri=rocks.length-1;ri>=0;ri--){
        const r=rocks[ri];
        if(Math.hypot(b.x-r.x,b.y-r.y)<r.r){hit=ri;break;}
      }
      if(hit>=0){
        const r=rocks.splice(hit,1)[0]; bullets.splice(bi,1);
        score+=Math.max(10,Math.round(60-r.r)); burst(r.x,r.y,"#00eaff",16);
        if(r.r>19){
          for(let k=0;k<2;k++) spawnRock(r.x,r.y,r.r*.58,65+Math.random()*45);
        }
        updateHud();
      }
    }
    if(ship.invuln<=0){
      for(let i=rocks.length-1;i>=0;i--){
        const r=rocks[i];
        if(Math.hypot(ship.x-r.x,ship.y-r.y)<r.r+12){
          rocks.splice(i,1); burst(ship.x,ship.y,"#ff4de1",24);
          lives--; updateHud();
          if(lives<=0){endGame();return;}
          ship=newShip(); break;
        }
      }
    }
    if(rocks.length===0){
      for(let i=0;i<5+Math.floor(score/500);i++){
        let x,y;
        do{x=Math.random()*w;y=Math.random()*h;}while(Math.hypot(x-ship.x,y-ship.y)<Math.min(w,h)*.3);
        spawnRock(x,y,30+Math.random()*15);
      }
    }
  }

  function drawShip() {
    if(!ship || (ship.invuln>0 && Math.floor(performance.now()/100)%2===0)) return;
    ctx.save(); ctx.translate(ship.x,ship.y); ctx.rotate(ship.angle);
    ctx.shadowBlur=16; ctx.shadowColor="#00eaff"; ctx.strokeStyle="#00eaff";
    ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(17,0); ctx.lineTo(-12,-11);
    ctx.lineTo(-7,0); ctx.lineTo(-12,11); ctx.closePath(); ctx.stroke();
    ctx.fillStyle="#00eaff20";ctx.fill();
    if(keys.has("ArrowUp")){
      ctx.shadowColor="#ff4de1";ctx.strokeStyle="#ff4de1";ctx.beginPath();
      ctx.moveTo(-9,-5);ctx.lineTo(-19-Math.random()*8,0);ctx.lineTo(-9,5);ctx.stroke();
    }
    ctx.restore();
  }
  function drawRock(r) {
    ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.angle);
    ctx.beginPath();
    for(let i=0;i<r.n;i++){
      const a=i/r.n*Math.PI*2, rr=r.r*r.points[i];
      if(i===0)ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);
      else ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
    }
    ctx.closePath();ctx.shadowBlur=12;ctx.shadowColor="#ff4de1";
    ctx.strokeStyle="#ff4de1";ctx.lineWidth=1.6;ctx.stroke();
    ctx.fillStyle="#180c25aa";ctx.fill();ctx.restore();
  }
  function draw() {
    ctx.clearRect(0,0,w,h);
    const t=performance.now()/1000;
    for(const s of stars){
      ctx.globalAlpha=s.a*(.65+.35*Math.sin(t*2+s.phase));
      ctx.fillStyle="#b9faff";ctx.fillRect(s.x,s.y,s.r,s.r);
    }
    ctx.globalAlpha=1;
    ctx.strokeStyle="#14213a";ctx.lineWidth=1;ctx.globalAlpha=.35;
    for(let x=0;x<w;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    for(let y=0;y<h;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    ctx.globalAlpha=1;
    for(const r of rocks)drawRock(r);
    for(const b of bullets){
      ctx.save();ctx.shadowBlur=14;ctx.shadowColor="#00eaff";ctx.fillStyle="#aaffff";
      ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill();ctx.restore();
    }
    for(const p of particles){
      ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;
      ctx.fillRect(p.x,p.y,2.5,2.5);
    }
    ctx.globalAlpha=1;drawShip();
  }
  function frame(now) {
    const dt=Math.min((now-last)/1000||0,.033);last=now;
    update(dt);draw();requestAnimationFrame(frame);
  }
  function endGame() {
    running=false;heading.textContent="SKEPPET FÖRLORAT";
    message.innerHTML=`Slutpoäng: <strong style="color:#00eaff">${String(score).padStart(6,"0")}</strong><br>Vill du försöka igen?`;
    startBtn.textContent="Spela igen";overlay.style.display="grid";
  }
  startBtn.addEventListener("click",()=>{
    reset();running=true;overlay.style.display="none";last=performance.now();
  });
  addEventListener("keydown",e=>{
    if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) e.preventDefault();
    keys.add(e.key);
    if(e.key==="Enter"&&!running) startBtn.click();
  });
  addEventListener("keyup",e=>keys.delete(e.key));
  addEventListener("blur",()=>keys.clear());
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
